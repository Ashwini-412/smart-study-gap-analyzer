# Values may use ${ENV_VAR:default}. The environment variable wins when set;
# otherwise the default after the colon is used.
# Secrets (DB_PASSWORD) have NO default here and must never be committed.

# --- HTTP server ---
server.host=${SERVER_HOST:127.0.0.1}
server.port=${SERVER_PORT:8080}

# --- MySQL ---
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:smart_study_gap_analyzer}
db.username=${DB_USERNAME:gap_app}
db.password=${DB_PASSWORD:}

# --- Frontend ---
# Directory of static files served at "/" (relative to the working directory; mvn exec:java runs in backend/).
frontend.dir=${FRONTEND_DIR:../frontend}

# --- Authentication ---
# Login session lifetime in hours (1..720).
auth.session.hours=${AUTH_SESSION_HOURS:24}

# --- Gap analysis thresholds (accuracy %) ---
# accuracy >= strong            -> Strong
# moderate <= accuracy < strong -> Moderate
# accuracy < moderate           -> Needs Improvement
gap.threshold.strong=75
gap.threshold.moderate=50
